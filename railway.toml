[build]
builder = "NIXPACKS"
buildCommand = "pnpm install --frozen-lockfile --prod=false && pnpm --filter api exec prisma generate && pnpm --filter api exec nest build"

[deploy]
startCommand = "pnpm --filter api exec prisma migrate deploy && node apps/api/dist/main.js"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
